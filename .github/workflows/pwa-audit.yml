name: Capta Academy PWA Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and required PWA files
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s pwa.js
          test -s pwa-icon-192.png
          test -s pwa-icon-512.png
          test -s pwa-icon-maskable-512.png
          python - <<'PY'
          import json
          m=json.load(open('manifest.webmanifest', encoding='utf-8'))
          assert m['name'] and m['short_name']
          assert m['start_url'] and m['scope']
          assert m['display'] == 'standalone'
          icons=m.get('icons',[])
          assert any(i.get('sizes')=='192x192' for i in icons)
          assert any(i.get('sizes')=='512x512' for i in icons)
          assert any('maskable' in i.get('purpose','') for i in icons)
          PY
      - name: Validate service worker safety and version alignment
        run: |
          grep -q "v9-private-vary-range-safe-shell" sw.js
          grep -q "sw.js?v=9-private-vary-range-safe-shell" pwa.js
          grep -q "updateViaCache:'none'" pwa.js
          grep -q "authorization" sw.js
          grep -q "cookie" sw.js
          grep -q "if-range" sw.js
          grep -q "private|no-store" sw.js
          grep -q "set-cookie" sw.js
          grep -q "content-range" sw.js
          grep -q "request.mode==='navigate'" sw.js
          grep -q "CORE_PATHS" sw.js
